<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>π | Peters Page</title>
    <link rel="icon" type="image/jpeg" href="Skorpion.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Zentrales Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Zentrale Konfiguration -->
    <script src="js/config.js"></script>

    <!-- MOBILE HEADER -->
    <div class="mobile-bar">
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="brand-logo" style="width:34px; height:34px;">
                <img src="Pi-vektor.jpg" alt="π" onerror="if(!this.dataset.low){this.dataset.low='1';this.src='pi-vektor.jpg';}else{this.outerHTML='<span style=\'color:#122620;font-weight:800;\'>π</span>';}">
            </div>
            <strong class="font-display" style="font-size:17px;">Pi @ Dippe-Sippe</strong>
        </div>
        <div style="display:flex; gap:6px;">
            <button class="btn btn-dark" style="padding:7px 11px; font-size:12.5px; border:1px solid var(--border-green);" onclick="shareCurrentPage()" title="Direktlink zu dieser Unterseite teilen">🔗</button>
            <button class="btn btn-sand" style="padding:7px 13px; font-size:13px;" onclick="toggleSidebar()">Menü ☰</button>
        </div>
    </div>

    <!-- SEITENLEISTE (SIDEBAR) -->
    <aside id="sidebar" class="sidebar">
        <div>
            <div class="brand-box">
                <div class="brand-logo">
                    <img src="Pi-vektor.jpg" alt="π" onerror="if(!this.dataset.low){this.dataset.low='1';this.src='pi-vektor.jpg';}else{this.outerHTML='<span style=\'color:#122620;font-weight:800;font-size:22px;\'>π</span>';}">
                </div>
                <div>
                    <div class="brand-title">Pi @ Dippe-Sippe</div>
                    <div class="brand-sub">⚡ Mathe · Geo · Sport · Vibe</div>
                </div>
            </div>

            <nav class="nav-list">
                <button onclick="switchPage('home')" id="nav-home" class="nav-btn active">
                    <span>🏠 Home</span>
                </button>

                <button onclick="toggleNavGroup('familie')" id="nav-familie" class="nav-btn">
                    <span>⚡ π's Kosmos & Cloud</span>
                    <span id="caret-familie" class="nav-caret">▸</span>
                </button>
                <div class="sub-nav" id="subnav-group-familie">
                    <button onclick="switchPage('pinnwand')" id="subnav-pinnwand" class="sub-nav-btn">
                        <span>📌 π's Pinnwand</span>
                    </button>
                    <button onclick="switchPage('fotos')" id="subnav-fotos" class="sub-nav-btn">
                        <span>📸 Fotos & Cloud</span>
                        <span id="lock-indicator">🔒</span>
                    </button>
                </div>

                <button onclick="toggleNavGroup('sport')" id="nav-sport" class="nav-btn">
                    <span>🏅 Sport-Ecke</span>
                    <span id="caret-sport" class="nav-caret">▸</span>
                </button>
                <div class="sub-nav" id="subnav-group-sport">
                    <button onclick="switchPage('tischtennis')" id="subnav-tischtennis" class="sub-nav-btn">
                        <span>🏓 Tischtennis</span>
                    </button>
                    <button onclick="switchPage('tt-news')" id="subnav-tt-news" class="sub-nav-btn">
                        <span>📰 TT-News</span>
                    </button>
                    <button onclick="switchPage('tt-ranking')" id="subnav-tt-ranking" class="sub-nav-btn">
                        <span>📈 TT-Ranking</span>
                    </button>
                    <button onclick="switchPage('turnierplaner')" id="subnav-turnierplaner" class="sub-nav-btn">
                        <span>🏆 Turnierplaner</span>
                    </button>
                    <button onclick="switchPage('zaehlboard')" id="subnav-zaehlboard" class="sub-nav-btn">
                        <span>🔢 Digitales Zählboard</span>
                    </button>
                    <button onclick="switchPage('radfahren')" id="subnav-radfahren" class="sub-nav-btn">
                        <span>🚴 Fahrradfahren</span>
                    </button>
                    <button onclick="switchPage('wandern')" id="subnav-wandern" class="sub-nav-btn">
                        <span>🥾 Wanderungen</span>
                    </button>
                    <button onclick="switchPage('kicker')" id="subnav-kicker" class="sub-nav-btn">
                        <span>⚽ Kickerabend</span>
                    </button>
                </div>

                <button onclick="toggleNavGroup('maptools')" id="nav-maptools" class="nav-btn">
                    <span>🗺️ Map-Tools</span>
                    <span id="caret-maptools" class="nav-caret">▸</span>
                </button>
                <div class="sub-nav" id="subnav-group-maptools">
                    <button onclick="switchPage('area-maps')" id="subnav-area-maps" class="sub-nav-btn">
                        <span>🌍 Maps Math</span>
                    </button>
                    <button onclick="switchPage('dominanz')" id="subnav-dominanz" class="sub-nav-btn">
                        <span>⛰️ Berg-Dominanz-Atlas</span>
                    </button>
                    <button onclick="switchPage('luftlinie')" id="subnav-luftlinie" class="sub-nav-btn">
                        <span>✈️ Luftlinien-Entfernung</span>
                    </button>
                    <button onclick="switchPage('area-pur')" id="subnav-area-pur" class="sub-nav-btn">
                        <span>📏 Pure Math</span>
                    </button>
                </div>

                <button onclick="toggleNavGroup('spiele')" id="nav-spiele" class="nav-btn">
                    <span>🎮 Spiele-Ecke</span>
                    <span id="caret-spiele" class="nav-caret">▸</span>
                </button>
                <div class="sub-nav" id="subnav-group-spiele">
                    <button onclick="switchPage('tetris')" id="subnav-tetris" class="sub-nav-btn">
                        <span>🧱 Tetris</span>
                    </button>
                    <button onclick="switchPage('minesweeper')" id="subnav-minesweeper" class="sub-nav-btn">
                        <span>💣 Minesweeper</span>
                    </button>
                    <button onclick="switchPage('snake')" id="subnav-snake" class="sub-nav-btn">
                        <span>🐍 Snake</span>
                    </button>
                </div>

                <button onclick="toggleNavGroup('rechtliches')" id="nav-rechtliches" class="nav-btn">
                    <span>⚖️ Rechtliches</span>
                    <span id="caret-rechtliches" class="nav-caret">▸</span>
                </button>
                <div class="sub-nav" id="subnav-group-rechtliches">
                    <button onclick="switchPage('impressum')" id="subnav-impressum" class="sub-nav-btn">
                        <span>📄 Impressum</span>
                    </button>
                </div>
            </nav>
        </div>

        <div class="sidebar-footer">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:700; color:#34d399;">● pi.dippe-sippe.de</span>
                <button onclick="shareCurrentPage()" style="background:rgba(52,211,153,0.15); border:1px solid rgba(52,211,153,0.35); color:#34d399; border-radius:8px; padding:3px 8px; font-size:11px; font-weight:700; cursor:pointer;" title="Direktlink zur aktuellen Seite kopieren">🔗 Link</button>
            </div>
            <div style="color:var(--text-muted); margin-top:4px;">Basecamp Graupa · Pirna</div>
        </div>
    </aside>

    <!-- DYNAMISCHER HAUPTBEREICH -->
    <main id="app-main" class="main-content"></main>

    <!-- Gemeinsames Highscore Top-10 Modal für die Spiele-Ecke -->
    <div class="modal-overlay" id="hs-modal">
        <div class="modal-box" style="max-width:420px; text-align:center;">
            <div style="font-size:38px; margin-bottom:6px;">🏆</div>
            <h3 id="hs-modal-title">Neuer Top-10 Highscore!</h3>
            <p id="hs-modal-text" style="font-size:14px; margin-bottom:14px;"></p>
            <form onsubmit="submitHighscoreName(event)" style="display:flex; flex-direction:column; gap:10px;">
                <input type="text" id="hs-player-name" class="form-input" placeholder="Dein Name (z. B. Pi, David, Alwin...)" maxlength="22" required style="text-align:center; font-weight:700; font-size:15px;">
                <div style="display:flex; gap:8px; justify-content:center; margin-top:4px;">
                    <button type="submit" class="btn btn-emerald" style="flex:1;">🏅 Eintragen</button>
                    <button type="button" class="btn btn-dark" onclick="closeHighscoreModal()">Überspringen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Globales, maskiertes Passwort-Modal -->
    <div class="modal-overlay" id="pwd-modal" onclick="if(event.target===this) closePasswordModal(null)">
        <div class="modal-box" style="max-width:400px; text-align:center;">
            <div style="font-size:36px; margin-bottom:6px;">🔐</div>
            <h3 id="pwd-modal-title" style="font-size:21px; font-weight:800; margin-bottom:6px;">Admin-Passwort</h3>
            <p id="pwd-modal-sub" style="font-size:13.5px; color:#475569; margin-bottom:14px;">Bitte gib das Passwort ein (Eingabe erfolgt verdeckt):</p>
            <form onsubmit="submitPasswordModal(event)" style="display:flex; flex-direction:column; gap:10px;">
                <input type="password" id="pwd-modal-input" class="form-input" placeholder="••••••••" autocomplete="current-password"
                       style="text-align:center; font-size:18px; letter-spacing:0.18em; font-weight:800; padding:11px;">
                <div style="display:flex; gap:8px; justify-content:center; margin-top:4px;">
                    <button type="submit" class="btn btn-emerald" style="flex:1;">🔓 Entsperren</button>
                    <button type="button" class="btn btn-dark" onclick="closePasswordModal(null)">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===================================================================
         MODULARE JAVASCRIPT-EINBINDUNG (1:1 SEITEN-ARCHITEKTUR)
         =================================================================== -->
    <script src="js/core.js"></script>
    <script src="js/home.js"></script>
    <script src="js/pinnwand.js"></script>
    <script src="js/fotos.js"></script>
    <script src="js/tischtennis.js"></script>
    <script src="js/tt-news.js"></script>
    <script src="js/tt-ranking.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="js/turnierplaner.js"></script>
    <script src="js/zaehlboard.js"></script>
    <script src="js/radfahren.js"></script>
    <script src="js/wandern.js"></script>
    <script src="js/kicker.js"></script>
    <script src="js/area-maps.js"></script>
    <script src="js/dominanz.js"></script>
    <script src="js/luftlinie.js"></script>
    <script src="js/area-pur.js"></script>
    <script src="js/highscores.js"></script>
    <script src="js/tetris.js"></script>
    <script src="js/minesweeper.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/impressum.js"></script>
</body>
</html>
