<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dippe-Sippe – Im Aufbau</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      color: #2d3748;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
      color: #1a202c;
    }
    p {
      font-size: 1.05rem;
      color: #718096;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #edf2f7;
      color: #4a5568;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">In Arbeit</span>
    <h1>dippe-sippe.de</h1>
    <p>Hier entsteht demnächst unsere neue Website.<br>Schau bald wieder vorbei!</p>
  </div>
</body>
</html>
