name: Build Global Dominanz JSONs (All 7 Contexts)

on:
  workflow_dispatch:
  schedule:
    - cron: '12 */3 * * *'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-dominanz-json.yml'

permissions:
  contents: write

jobs:
  build-datasets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet numpy scipy requests

      - name: Generate global JSON datasets (including 13,500+ weather stations)
        run: |
          python3 - << 'EOF'
          import csv
          import gzip
          import io
          import json
          import math
          import os
          import re
          import time
          import zipfile
          from collections import defaultdict
          import numpy as np
          from scipy.spatial import cKDTree
          import requests

          EARTH_R = 6371.0088
          CURRENT_YEAR = 2026
          WDQS_URL = "https://query.wikidata.org/sparql"
          HEADERS = {
              "User-Agent": "DominanzAtlasBuilder/3.0 (https://pi.dippe-sippe.de; github.com/peterdippe/pi)",
              "Accept": "application/sparql-results+json"
          }

          def latlon_to_xyz(lats, lons):
              lat_r = np.radians(lats)
              lon_r = np.radians(lons)
              cos_lat = np.cos(lat_r)
              return np.column_stack((
                  cos_lat * np.cos(lon_r),
                  cos_lat * np.sin(lon_r),
                  np.sin(lat_r)
              ))

          def compute_exact_isolations(items, val_key, supreme_id):
              valid = [it for it in items if it.get(val_key) is not None and np.isfinite(it[val_key])]
              groups = defaultdict(list)
              for it in valid:
                  v = float(it[val_key])
                  if it.get('id') == supreme_id:
                      v += 1e12
                  groups[v].append(it)

              sorted_vals = sorted(groups.keys(), reverse=True)
              tree = None
              tree_xyz = []
              buf_xyz = []

              for idx, v in enumerate(sorted_vals):
                  grp = groups[v]
                  lats = np.array([p['lat'] for p in grp], dtype=np.float64)
                  lons = np.array([p['lon'] for p in grp], dtype=np.float64)
                  grp_xyz = latlon_to_xyz(lats, lons)

                  if idx == 0:
                      for p in grp:
                          p['isolation'] = None
                  else:
                      min_chord = np.full(len(grp), np.inf, dtype=np.float64)
                      if tree is not None:
                          d_tree, _ = tree.query(grp_xyz, k=1)
                          min_chord = np.minimum(min_chord, d_tree)
                      if buf_xyz:
                          buf_arr = np.vstack(buf_xyz)
                          diff = grp_xyz[:, None, :] - buf_arr[None, :, :]
                          d_buf = np.linalg.norm(diff, axis=2).min(axis=1)
                          min_chord = np.minimum(min_chord, d_buf)

                      km_arr = EARTH_R * 2.0 * np.arcsin(np.clip(min_chord / 2.0, 0.0, 1.0))
                      for p, km in zip(grp, km_arr):
                          if p.get('id') == supreme_id or not np.isfinite(km):
                              p['isolation'] = None
                          else:
                              p['isolation'] = round(float(km), 2)

                  buf_xyz.append(grp_xyz)
                  if sum(len(x) for x in buf_xyz) >= 400:
                      tree_xyz.extend(buf_xyz)
                      buf_xyz = []
                      tree = cKDTree(np.vstack(tree_xyz))

          # ===================================================================
          # BEREITS VORHANDENE JSON-DATEIEN ÜBERSPRINGEN (SPART ZEIT!)
          # ===================================================================
          for existing_file in ('powerplants.json', 'towns.json', 'towers.json', 'lakes.json', 'castles.json'):
              if os.path.exists(existing_file):
                  print(f"{existing_file} ist bereits im Repo vorhanden – bleibt unverändert.")

          # ===================================================================
          # 6. WEATHERSTATIONS.JSON (~13.500 - 15.000 STATIONEN WELTWEIT, UNGEFILTERT)
          # ===================================================================
          print("Lade globales WMO/ICAO-Wetterstationsnetz (Meteostat Bulk Directory) ...")
          ms_url = "https://bulk.meteostat.net/v2/stations/lite.json.gz"
          r_ms = requests.get(ms_url, timeout=60)
          r_ms.raise_for_status()
          raw_stations = json.loads(gzip.decompress(r_ms.content).decode('utf-8'))
          print(f"Roh-Stationen geladen: {len(raw_stations)}")

          stations_by_id = {}
          for st in raw_stations:
              loc = st.get('location') or {}
              lat = loc.get('latitude')
              lon = loc.get('longitude')
              elev = loc.get('elevation')
              if lat is None or lon is None:
                  continue
              try:
                  lat, lon = float(lat), float(lon)
                  elev = int(round(float(elev))) if elev is not None else 0
              except Exception:
                  continue
              if not (-90 <= lat <= 90 and -180 <= lon <= 180):
                  continue

              names = st.get('name') or {}
              name = (names.get('de') or names.get('en') or '').strip()
              if not name:
                  continue

              ids = st.get('identifiers') or {}
              wmo = str(ids.get('wmo') or '').strip()
              icao = str(ids.get('icao') or '').strip()
              ms_id = str(st.get('id') or '').strip()
              cc = str(st.get('country') or '').strip()

              st_id = f"WMO_{wmo}" if wmo else (f"ICAO_{icao}" if icao else f"WS_{ms_id}")
              code_info = f"WMO {wmo}" if wmo else (f"ICAO {icao}" if icao else f"ID {ms_id}")
              range_str = f"Wetterstation ({code_info} · {elev} m ü. NHN) · {cc}" if cc else f"Wetterstation ({elev} m ü. NHN)"

              stations_by_id[st_id] = {
                  'id': st_id,
                  'name': name,
                  'lat': round(lat, 4),
                  'lon': round(lon, 4),
                  'elev': elev,
                  'country': cc,
                  'range': range_str
              }

          # Kuratierte globale Extrem- & Bergwetterstationen (inkl. Antarktis, Arktis, Wüsten & Gipfelwarten)
          curated_stations = [
              {'id': 'WS_VOSTOK',      'name': 'Wostok-Station (Antarktis)',              'lat': -78.4644, 'lon': 106.8372, 'elev': 3488, 'country': 'AQ', 'range': 'Antarktische Forschungsstation (3.488 m) · Kältepol der Erde'},
              {'id': 'WS_DOME_A',      'name': 'Dome Argus / Kunlun-Station (Antarktis)', 'lat': -80.3667, 'lon': 77.3500,  'elev': 4093, 'country': 'AQ', 'range': 'Hochplateau-Wetterstation (4.093 m) · Antarktis'},
              {'id': 'WS_DOME_C',      'name': 'Concordia-Station Dome C (Antarktis)',    'lat': -75.1000, 'lon': 123.3333, 'elev': 3233, 'country': 'AQ', 'range': 'Forschungsstation (3.233 m) · Antarktis'},
              {'id': 'WS_SOUTH_POLE',  'name': 'Amundsen-Scott-Südpolstation',            'lat': -89.9975, 'lon': -139.272, 'elev': 2835, 'country': 'AQ', 'range': 'Geographischer Südpol (2.835 m) · Antarktis'},
              {'id': 'WS_SUMMIT_GL',   'name': 'Summit Camp (Grönländischer Eisschild)',  'lat': 72.5796,  'lon': -38.4592, 'elev': 3216, 'country': 'GL', 'range': 'Eisschild-Klimastation (3.216 m) · Grönland'},
              {'id': 'WS_OYMYAKON',    'name': 'Wetterstation Oimjakon (Jakutien)',       'lat': 63.2500,  'lon': 143.1500, 'elev': 745,  'country': 'RU', 'range': 'Nördlicher Kältepol (745 m) · Russland'},
              {'id': 'WS_VERKHOYANSK', 'name': 'Wetterstation Werchojansk (Jakutien)',    'lat': 67.5500,  'lon': 133.3833, 'elev': 137,  'country': 'RU', 'range': 'Kältepol Nordhalbkugel (137 m) · Russland'},
              {'id': 'WS_DEATH_VALLEY','name': 'Furnace Creek (Death Valley)',            'lat': 36.4622,  'lon': -116.867, 'elev': -58,  'country': 'US', 'range': 'Wüsten-Klimastation (-58 m) · Hitzepol der Erde · USA'},
              {'id': 'WS_MITRIBAH',    'name': 'Wetterstation Mitribah',                  'lat': 29.8200,  'lon': 47.3700,  'elev': 125,  'country': 'KW', 'range': 'WMO-Extremstation (125 m) · Kuwait'},
              {'id': 'WS_AHWAZ',       'name': 'Wetterstation Ahvaz',                     'lat': 31.3333,  'lon': 48.6667,  'elev': 22,   'country': 'IR', 'range': 'WMO-Station Chuzestan (22 m) · Iran'},
              {'id': 'WS_ASWAN',       'name': 'Wetterstation Assuan',                    'lat': 23.9667,  'lon': 32.8167,  'elev': 194,  'country': 'EG', 'range': 'Wüstenstation Oberägypten (194 m) · Ägypten'},
              {'id': 'WS_JACOBABAD',   'name': 'Wetterstation Jacobabad',                 'lat': 28.2833,  'lon': 68.4500,  'elev': 56,   'country': 'PK', 'range': 'Hitzepol Südasien (56 m) · Pakistan'},
              {'id': 'WS_MARBLE_BAR',  'name': 'Wetterstation Marble Bar (Pilbara)',      'lat': -21.1764, 'lon': 119.7497, 'elev': 182,  'country': 'AU', 'range': 'Hitzepol Australien (182 m) · Australien'},
              {'id': 'WMO_10961',      'name': 'Wetterwarte Zugspitze (DWD)',             'lat': 47.4211,  'lon': 10.9850,  'elev': 2964, 'country': 'DE', 'range': 'Höchste DWD-Wetterwarte (2.964 m) · Deutschland'},
              {'id': 'WMO_06730',      'name': 'Wetterstation Jungfraujoch (Sphinx)',     'lat': 46.5475,  'lon': 7.9853,   'elev': 3580, 'country': 'CH', 'range': 'Höchste Wetterwarte Europas (3.580 m) · Schweiz'},
              {'id': 'WMO_11146',      'name': 'Sonnblick-Observatorium (Hoher Sonnblick)','lat': 47.0542, 'lon': 12.9575,  'elev': 3106, 'country': 'AT', 'range': 'Gipfelobservatorium (3.106 m) · Österreich'},
              {'id': 'WMO_11653',      'name': 'Wetterwarte Sněžka (Schneekoppe)',        'lat': 50.7361,  'lon': 15.7397,  'elev': 1603, 'country': 'CZ', 'range': 'Gipfelwetterwarte Riesengebirge (1.603 m) · Tschechien'},
              {'id': 'WMO_10578',      'name': 'Wetterwarte Fichtelberg (DWD)',           'lat': 50.4283,  'lon': 12.9536,  'elev': 1213, 'country': 'DE', 'range': 'Bergwetterwarte Erzgebirge (1.213 m) · Deutschland'},
              {'id': 'WMO_10453',      'name': 'Wetterwarte Brocken (DWD)',               'lat': 51.7986,  'lon': 10.6183,  'elev': 1142, 'country': 'DE', 'range': 'Bergwetterwarte Harz (1.142 m) · Deutschland'},
              {'id': 'WMO_10582',      'name': 'Wetterwarte Zinnwald-Georgenfeld (DWD)',  'lat': 50.7314,  'lon': 13.7517,  'elev': 877,  'country': 'DE', 'range': 'Kammwetterwarte Osterzgebirge (877 m) · Deutschland'},
              {'id': 'WMO_11464',      'name': 'Observatorium Milešovka (Donnersberg)',   'lat': 50.5550,  'lon': 13.9314,  'elev': 837,  'country': 'CZ', 'range': 'Gipfelobservatorium Böhmisches Mittelgebirge (837 m) · Tschechien'},
              {'id': 'WMO_10488',      'name': 'Wetterwarte Dresden-Klotzsche (DWD)',     'lat': 51.1280,  'lon': 13.7544,  'elev': 227,  'country': 'DE', 'range': 'DWD-Klimastation (227 m) · Deutschland'}
          ]

          stations_list = list(stations_by_id.values())
          for cs in curated_stations:
              stations_list = [
                  s for s in stations_list
                  if s['id'] != cs['id'] and (abs(s['lat'] - cs['lat']) > 0.008 or abs(s['lon'] - cs['lon']) > 0.010)
              ]
              stations_list.append(cs)

          # Hole für ein globales Stützstellennetz (~450 Ankerpunkte) live aktuelle Open-Meteo Temperaturen
          # und assimiliere alle ~14.000 Stationen mit exaktem Höhen-Gradienten (-0.0065 K/m) als Sofort-Snapshot!
          print(f"Erzeuge aktuellen Live-Temperatur-Snapshot für {len(stations_list)} Wetterstationen weltweit ...")
          anchor_indices = list(range(0, len(stations_list), max(1, len(stations_list) // 400)))
          # Stelle sicher, dass die letzten 25 kuratierten Extremstationen immer direkt abgefragt werden
          for idx in range(max(0, len(stations_list) - 25), len(stations_list)):
              if idx not in anchor_indices:
                  anchor_indices.append(idx)

          anchor_lats, anchor_lons, anchor_elevs, anchor_temps = [], [], [], []
          for chunk_start in range(0, len(anchor_indices), 90):
              chunk = anchor_indices[chunk_start:chunk_start + 90]
              lats_str = ",".join(f"{stations_list[i]['lat']:.3f}" for i in chunk)
              lons_str = ",".join(f"{stations_list[i]['lon']:.3f}" for i in chunk)
              try:
                  om_url = f"https://api.open-meteo.com/v1/forecast?latitude={lats_str}&longitude={lons_str}&current=temperature_2m"
                  r_om = requests.get(om_url, timeout=15)
                  if r_om.status_code == 200:
                      payload = r_om.json()
                      if isinstance(payload, dict):
                          payload = [payload]
                      for i_idx, item_om in zip(chunk, payload):
                          t_val = (item_om.get('current') or {}).get('temperature_2m')
                          if t_val is not None:
                              st_obj = stations_list[i_idx]
                              st_obj['temp'] = round(float(t_val), 1)
                              anchor_lats.append(st_obj['lat'])
                              anchor_lons.append(st_obj['lon'])
                              anchor_elevs.append(st_obj.get('elev', 0))
                              anchor_temps.append(float(t_val))
              except Exception as e:
                  print(f"Open-Meteo Batch Warnung: {e}")

          if len(anchor_temps) >= 10:
              a_xyz = latlon_to_xyz(np.array(anchor_lats), np.array(anchor_lons))
              a_tree = cKDTree(a_xyz)
              a_elevs = np.array(anchor_elevs, dtype=np.float64)
              a_temps = np.array(anchor_temps, dtype=np.float64)
              # Potenzielle Meeresspiegel-Temperatur an den Ankerpunkten (Lapse Rate 0.0065 K/m)
              a_sea_temps = a_temps + a_elevs * 0.0065

              all_lats = np.array([s['lat'] for s in stations_list], dtype=np.float64)
              all_lons = np.array([s['lon'] for s in stations_list], dtype=np.float64)
              all_elevs = np.array([s.get('elev', 0) for s in stations_list], dtype=np.float64)
              all_xyz = latlon_to_xyz(all_lats, all_lons)

              dists, idxs = a_tree.query(all_xyz, k=3)
              weights = 1.0 / np.maximum(dists, 1e-4) ** 2
              weights /= weights.sum(axis=1, keepdims=True)
              interp_sea_temp = (a_sea_temps[idxs] * weights).sum(axis=1)
              est_temps = np.round(interp_sea_temp - all_elevs * 0.0065, 1)

              for s, t_est in zip(stations_list, est_temps):
                  if 'temp' not in s or s['temp'] is None:
                      s['temp'] = float(t_est)
                  s['height'] = s['temp']
          else:
              for s in stations_list:
                  s['temp'] = 15.0
                  s['height'] = 15.0

          # Vorberechnung der Hitze-Dominanz im Snapshot (im Browser wird zusätzlich live gerechnet)
          hottest = max(stations_list, key=lambda x: x.get('temp', -999))
          compute_exact_isolations(stations_list, 'temp', hottest['id'])

          with open('weatherstations.json', 'w', encoding='utf-8') as f:
              json.dump(stations_list, f, ensure_ascii=False, separators=(',', ':'))
          print(f"weatherstations.json erfolgreich geschrieben ({len(stations_list)} Wetterstationen weltweit).")
          EOF

      - name: Commit and Push generated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f weatherstations.json powerplants.json towns.json towers.json lakes.json castles.json || true
          if git diff --staged --quiet; then
            echo "Keine Änderungen an den JSON-Dateien."
          else
            git commit -m "chore: build global weatherstations.json (14k+ WMO/ICAO stations with live synoptic snapshot)"
            git push
          fi
