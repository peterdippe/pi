name: Build Global Dominanz JSONs (All Contexts)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-dominanz-json.yml'

permissions:
  contents: write

jobs:
  build-datasets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet numpy scipy requests

      - name: Generate global JSON datasets with exact geodesic isolation
        run: |
          python3 - << 'EOF'
          import csv
          import io
          import json
          import math
          import os
          import re
          import time
          import zipfile
          from collections import defaultdict
          import numpy as np
          from scipy.spatial import cKDTree
          import requests

          EARTH_R = 6371.0088
          CURRENT_YEAR = 2026
          WDQS_URL = "https://query.wikidata.org/sparql"
          HEADERS = {
              "User-Agent": "DominanzAtlasBuilder/2.0 (https://pi.dippe-sippe.de; github.com/peterdippe/pi)",
              "Accept": "application/sparql-results+json"
          }

          def latlon_to_xyz(lats, lons):
              lat_r = np.radians(lats)
              lon_r = np.radians(lons)
              cos_lat = np.cos(lat_r)
              return np.column_stack((
                  cos_lat * np.cos(lon_r),
                  cos_lat * np.sin(lon_r),
                  np.sin(lat_r)
              ))

          def compute_exact_isolations(items, val_key, supreme_id):
              valid = [it for it in items if it.get(val_key) is not None and it[val_key] > 0]
              groups = defaultdict(list)
              for it in valid:
                  v = float(it[val_key])
                  if it.get('id') == supreme_id:
                      v += 1e12
                  groups[v].append(it)

              sorted_vals = sorted(groups.keys(), reverse=True)
              tree = None
              tree_xyz = []
              buf_xyz = []

              for idx, v in enumerate(sorted_vals):
                  grp = groups[v]
                  lats = np.array([p['lat'] for p in grp], dtype=np.float64)
                  lons = np.array([p['lon'] for p in grp], dtype=np.float64)
                  grp_xyz = latlon_to_xyz(lats, lons)

                  if idx == 0:
                      for p in grp:
                          p['isolation'] = None
                  else:
                      min_chord = np.full(len(grp), np.inf, dtype=np.float64)
                      if tree is not None:
                          d_tree, _ = tree.query(grp_xyz, k=1)
                          min_chord = np.minimum(min_chord, d_tree)
                      if buf_xyz:
                          buf_arr = np.vstack(buf_xyz)
                          diff = grp_xyz[:, None, :] - buf_arr[None, :, :]
                          d_buf = np.linalg.norm(diff, axis=2).min(axis=1)
                          min_chord = np.minimum(min_chord, d_buf)

                      km_arr = EARTH_R * 2.0 * np.arcsin(np.clip(min_chord / 2.0, 0.0, 1.0))
                      for p, km in zip(grp, km_arr):
                          if p.get('id') == supreme_id or not np.isfinite(km):
                              p['isolation'] = None
                          else:
                              p['isolation'] = round(float(km), 2)

                  buf_xyz.append(grp_xyz)
                  if sum(len(x) for x in buf_xyz) >= 400:
                      tree_xyz.extend(buf_xyz)
                      buf_xyz = []
                      tree = cKDTree(np.vstack(tree_xyz))

          def run_sparql(query, desc="SPARQL"):
              for attempt in range(3):
                  try:
                      r = requests.post(WDQS_URL, data={'query': query, 'format': 'json'}, headers=HEADERS, timeout=55)
                      if r.status_code == 200:
                          return r.json().get('results', {}).get('bindings', [])
                      elif r.status_code == 429:
                          time.sleep(4 * (attempt + 1))
                  except Exception as e:
                      print(f"Warnung bei {desc} (Versuch {attempt+1}): {e}")
                      time.sleep(2)
              return []

          def parse_wkt_point(wkt):
              m = re.search(r'Point\(([-\d.]+)\s+([-\d.]+)\)', str(wkt or ''))
              if not m:
                  return None, None
              lon, lat = float(m.group(1)), float(m.group(2))
              if -90 <= lat <= 90 and -180 <= lon <= 180:
                  return round(lat, 5), round(lon, 5)
              return None, None

          # ===================================================================
          # 1. POWERPLANTS & 2. TOWNS (nur neu bauen, falls noch nicht im Repo)
          # ===================================================================
          if not os.path.exists('powerplants.json'):
              print("Baue powerplants.json ...")
              wri_url = "https://raw.githubusercontent.com/wri/global-power-plant-database/master/output_database/global_power_plant_database.csv"
              r = requests.get(wri_url, timeout=60)
              r.raise_for_status()
              fuel_map = {'Solar':'solar','Wind':'wind','Hydro':'hydro','Wave and Tidal':'hydro','Pumped Storage':'hydro','Coal':'coal','Gas':'gas','Oil':'gas','Nuclear':'nuclear','Biomass':'biomass','Waste':'biomass','Biogas':'biomass'}
              type_label_de = {'solar':'Solarpark','wind':'Windpark','hydro':'Wasserkraftwerk','coal':'Kohlekraftwerk','gas':'Gaskraftwerk','nuclear':'Kernkraftwerk','biomass':'Biomasse / Müllheizkraftwerk','other':'Kraftwerk'}
              plants = []
              for row in csv.DictReader(io.StringIO(r.text)):
                  try:
                      cap = float(row.get('capacity_mw') or 0)
                      lat, lon = float(row.get('latitude')), float(row.get('longitude'))
                  except Exception:
                      continue
                  if cap < 1.0 or not (-90 <= lat <= 90 and -180 <= lon <= 180):
                      continue
                  ptype = fuel_map.get((row.get('primary_fuel') or '').strip(), 'other')
                  country = (row.get('country_long') or row.get('country') or '').strip()
                  gppd_id = (row.get('gppd_idnr') or f"P_{len(plants)}").strip()
                  cap_round = round(cap, 1) if cap < 100 else round(cap)
                  plants.append({'id':gppd_id,'name':(row.get('name') or gppd_id).strip(),'lat':round(lat,5),'lon':round(lon,5),'capacity':cap_round,'height':cap_round,'type':ptype,'country':country,'range':f"{type_label_de[ptype]} · {country}" if country else type_label_de[ptype]})
              plants.append({'id':'Q12514','name':'Drei-Schluchten-Staudamm','lat':30.82306,'lon':111.00333,'capacity':22500,'height':22500,'type':'hydro','country':'China','range':'Wasserkraftwerk · China'})
              compute_exact_isolations(plants, 'capacity', 'Q12514')
              plants.sort(key=lambda x: x['capacity'], reverse=True)
              with open('powerplants.json', 'w', encoding='utf-8') as f:
                  json.dump(plants, f, ensure_ascii=False, separators=(',', ':'))
          else:
              print("powerplants.json existiert bereits – überspringe Neubau.")

          if not os.path.exists('towns.json'):
              print("Baue towns.json ...")
              r_geo = requests.get("https://download.geonames.org/export/dump/cities1000.zip", timeout=90)
              r_geo.raise_for_status()
              towns = []
              with zipfile.ZipFile(io.BytesIO(r_geo.content)) as z:
                  with z.open('cities1000.txt') as txt_file:
                      for raw_line in io.TextIOWrapper(txt_file, encoding='utf-8'):
                          parts = raw_line.rstrip('\n').split('\t')
                          if len(parts) < 15 or parts[7].strip() in ('PPLX','PPLH','PPLW','PPLQ'):
                              continue
                          try:
                              lat, lon, cc, pop = float(parts[4]), float(parts[5]), parts[8].strip(), int(parts[14] or 0)
                          except Exception:
                              continue
                          min_p = 1000 if cc in ('DE','AT','CH') else (5000 if cc in ('FR','IT','ES','PL','CZ','NL','BE','DK','SE','NO','FI','GB','PT','HU','SK','SI','HR') else 12000)
                          if pop < min_p:
                              continue
                          towns.append({'id':f"GN_{parts[0]}",'name':parts[1].strip(),'lat':round(lat,5),'lon':round(lon,5),'population':pop,'height':pop,'range':f"Stadt · {cc}"})
              towns.append({'id':'Q1490','name':'Tokio','lat':35.68949,'lon':139.69171,'population':37400000,'height':37400000,'range':'Metropole · Japan'})
              compute_exact_isolations(towns, 'population', 'Q1490')
              towns.sort(key=lambda x: x['population'], reverse=True)
              with open('towns.json', 'w', encoding='utf-8') as f:
                  json.dump(towns, f, ensure_ascii=False, separators=(',', ':'))
          else:
              print("towns.json existiert bereits – überspringe Neubau.")

          # ===================================================================
          # 3. TOWERS.JSON (Türme, Fernsehtürme, Wolkenkratzer, Kirchen, Brücken)
          # ===================================================================
          print("Baue globale towers.json (Türme & Bauwerke weltweit) ...")
          tower_batches = [
              ("Wolkenkratzer & Hochhäuser", "wd:Q11303 wd:Q18142", "skyscraper", "Wolkenkratzer / Hochhaus", 65),
              ("Fernseh-, Sende- & Funktürme", "wd:Q11166728 wd:Q1798641 wd:Q1811679 wd:Q1140415", "tvtower", "Fernseh- / Funkturm", 25),
              ("Aussichtstürme, Türme & Leuchttürme", "wd:Q1440476 wd:Q12518 wd:Q39715 wd:Q274153", "lookout", "Aussichts- / Leuchtturm", 20),
              ("Kamine, Brücken & Monumentaltürme", "wd:Q2917149 wd:Q12280 wd:Q16970 wd:Q2977", "church", "Dom / Brücke / Schornstein", 55)
          ]

          towers_by_id = {}
          for batch_name, classes_str, default_t, default_label, min_h in tower_batches:
              q = f"""
              SELECT ?item ?coord ?h ?unit ?label_de ?label_en WHERE {{
                VALUES ?cls {{ {classes_str} }}
                ?item wdt:P31 ?cls ;
                      wdt:P625 ?coord ;
                      p:P2048/psv:P2048 ?hNode .
                ?hNode wikibase:quantityAmount ?h ;
                       wikibase:quantityUnit ?unit .
                FILTER(?h >= {min_h})
                OPTIONAL {{ ?item rdfs:label ?label_de FILTER(LANG(?label_de) = "de") }}
                OPTIONAL {{ ?item rdfs:label ?label_en FILTER(LANG(?label_en) = "en") }}
              }} LIMIT 9000
              """
              rows = run_sparql(q, batch_name)
              print(f"  -> {batch_name}: {len(rows)} Roh-Treffer")
              for b in rows:
                  qid = (b.get('item', {}).get('value') or '').split('/').pop()
                  if not qid or qid in towers_by_id:
                      continue
                  name = (b.get('label_de', {}).get('value') or b.get('label_en', {}).get('value') or '').strip()
                  if not name or re.match(r'^Q\d+$', name):
                      continue
                  lat, lon = parse_wkt_point(b.get('coord', {}).get('value'))
                  if lat is None:
                      continue
                  try:
                      h_val = float(b.get('h', {}).get('value') or 0)
                  except Exception:
                      continue
                  unit_q = (b.get('unit', {}).get('value') or '').split('/').pop()
                  if unit_q == 'Q3710':       # Foot -> Meter
                      h_val *= 0.3048
                  elif unit_q == 'Q174728':   # cm -> Meter
                      h_val *= 0.01
                  elif unit_q == 'Q828224':   # km -> Meter
                      h_val *= 1000.0
                  elif unit_q != 'Q11573':
                      continue
                  if h_val < min_h or h_val > 830:
                      continue

                  t_type = default_t
                  t_label = default_label
                  nl = name.lower()
                  if any(w in nl for w in ('fernsehturm', 'funkturm', 'sendeturm', 'sender', 'tv tower', 'radio mast')):
                      t_type, t_label = 'tvtower', 'Fernseh- / Funkturm'
                  elif any(w in nl for w in ('aussichtsturm', 'leuchtturm', 'warte', 'observation', 'lighthouse')):
                      t_type, t_label = 'lookout', 'Aussichts- / Leuchtturm'
                  elif any(w in nl for w in ('dom', 'münster', 'kirche', 'kathedrale', 'cathedral', 'basilika')):
                      t_type, t_label = 'church', 'Kirchenbauwerk / Dom'
                  elif any(w in nl for w in ('brücke', 'bridge', 'viadukt', 'schornstein', 'kamin', 'chimney')):
                      t_type, t_label = 'industrial', 'Brücke / Industriebauwerk'

                  h_round = round(h_val, 1) if h_val < 100 else round(h_val)
                  towers_by_id[qid] = {
                      'id': qid,
                      'name': name,
                      'lat': lat,
                      'lon': lon,
                      'height': h_round,
                      'type': t_type,
                      'range': t_label
                  }

          curated_towers = [
              {'id': 'Q12495',    'name': 'Burj Khalifa',                     'lat': 25.19714, 'lon': 55.27411,  'height': 828,   'type': 'skyscraper', 'range': 'Wolkenkratzer · Dubai (VAE)'},
              {'id': 'Q25351660', 'name': 'Merdeka 118',                      'lat': 3.14133,  'lon': 101.70065, 'height': 678.9, 'type': 'skyscraper', 'range': 'Wolkenkratzer · Kuala Lumpur'},
              {'id': 'Q57965',    'name': 'Tokyo Skytree',                    'lat': 35.71006, 'lon': 139.81070, 'height': 634,   'type': 'tvtower',    'range': 'Fernsehturm · Tokio (Japan)'},
              {'id': 'Q169237',   'name': 'Shanghai Tower',                   'lat': 31.23550, 'lon': 121.50100, 'height': 632,   'type': 'skyscraper', 'range': 'Wolkenkratzer · Shanghai (China)'},
              {'id': 'Q189960',   'name': 'Abraj Al Bait Clock Tower',        'lat': 21.41889, 'lon': 39.82639,  'height': 601,   'type': 'skyscraper', 'range': 'Uhrturm-Wolkenkratzer · Mekka'},
              {'id': 'Q185695',   'name': 'Canton Tower',                     'lat': 23.10889, 'lon': 113.31917, 'height': 600,   'type': 'tvtower',    'range': 'Fernsehturm · Guangzhou (China)'},
              {'id': 'Q134883',   'name': 'CN Tower',                         'lat': 43.64260, 'lon': -79.38710, 'height': 553.3, 'type': 'tvtower',    'range': 'Fernsehturm · Toronto (Kanada)'},
              {'id': 'Q11239',    'name': 'One World Trade Center',           'lat': 40.71300, 'lon': -74.01350, 'height': 541.3, 'type': 'skyscraper', 'range': 'Wolkenkratzer · New York (USA)'},
              {'id': 'Q131290',   'name': 'Ostankino-Fernsehturm',            'lat': 55.81972, 'lon': 37.61167,  'height': 540.1, 'type': 'tvtower',    'range': 'Fernsehturm · Moskau'},
              {'id': 'Q83102',    'name': 'Taipei 101',                       'lat': 25.03361, 'lon': 121.56500, 'height': 508,   'type': 'skyscraper', 'range': 'Wolkenkratzer · Taipeh'},
              {'id': 'Q15733555', 'name': 'Lachta-Zentrum',                   'lat': 59.98714, 'lon': 30.17703,  'height': 462,   'type': 'skyscraper', 'range': 'Wolkenkratzer · Sankt Petersburg'},
              {'id': 'Q83063',    'name': 'Petronas Towers',                  'lat': 3.15785,  'lon': 101.71165, 'height': 451.9, 'type': 'skyscraper', 'range': 'Wolkenkratzer · Kuala Lumpur'},
              {'id': 'Q9188',     'name': 'Empire State Building',            'lat': 40.74843, 'lon': -73.98566, 'height': 443.2, 'type': 'skyscraper', 'range': 'Wolkenkratzer · New York (USA)'},
              {'id': 'Q1151292',  'name': 'Kamin Kraftwerk Ekibastus GRES-2', 'lat': 52.02222, 'lon': 75.47639,  'height': 419.7, 'type': 'industrial', 'range': 'Kraftwerksschornstein · Kasachstan'},
              {'id': 'Q151356',   'name': 'Berliner Fernsehturm',             'lat': 52.52083, 'lon': 13.40944,  'height': 368,   'type': 'tvtower',    'range': 'Fernsehturm · Berlin'},
              {'id': 'Q848464',   'name': 'Fernsehturm Riga',                 'lat': 56.92389, 'lon': 24.13722,  'height': 368,   'type': 'tvtower',    'range': 'Fernsehturm · Riga (Lettland)'},
              {'id': 'Q819611',   'name': 'Kamin Kraftwerk Trbovlje',         'lat': 46.12611, 'lon': 15.06167,  'height': 360,   'type': 'industrial', 'range': 'Schornstein · Slowenien'},
              {'id': 'Q698702',   'name': 'Europaturm Frankfurt',             'lat': 50.13528, 'lon': 8.65472,   'height': 337.5, 'type': 'tvtower',    'range': 'Fernmeldeturm · Frankfurt am Main'},
              {'id': 'Q243',      'name': 'Eiffelturm',                       'lat': 48.85822, 'lon': 2.29450,   'height': 330,   'type': 'lookout',    'range': 'Aussichtsturm · Paris (Frankreich)'},
              {'id': 'Q18536',    'name': 'The Shard',                        'lat': 51.50444, 'lon': -0.08667,  'height': 309.6, 'type': 'skyscraper', 'range': 'Wolkenkratzer · London'},
              {'id': 'Q882746',   'name': 'Fernmeldeturm Nürnberg',           'lat': 49.42528, 'lon': 11.03917,  'height': 292.8, 'type': 'tvtower',    'range': 'Fernmeldeturm · Nürnberg'},
              {'id': 'Q258165',   'name': 'Olympiaturm München',              'lat': 48.17444, 'lon': 11.55361,  'height': 291.3, 'type': 'tvtower',    'range': 'Fernsehturm · München'},
              {'id': 'Q694825',   'name': 'Heinrich-Hertz-Turm Hamburg',      'lat': 53.56306, 'lon': 9.97583,   'height': 279.2, 'type': 'tvtower',    'range': 'Fernsehturm · Hamburg'},
              {'id': 'Q522845',   'name': 'Colonius Köln',                    'lat': 50.94694, 'lon': 6.93194,   'height': 266,   'type': 'tvtower',    'range': 'Fernmeldeturm · Köln'},
              {'id': 'Q151773',   'name': 'Commerzbank Tower',                'lat': 50.11111, 'lon': 8.67444,   'height': 259,   'type': 'skyscraper', 'range': 'Wolkenkratzer · Frankfurt am Main'},
              {'id': 'Q572551',   'name': 'Fernsehturm Dresden',              'lat': 51.03972, 'lon': 13.86889,  'height': 252,   'type': 'tvtower',    'range': 'Fernsehturm · Dresden'},
              {'id': 'Q690392',   'name': 'Donauturm Wien',                   'lat': 48.24028, 'lon': 16.41000,  'height': 252,   'type': 'tvtower',    'range': 'Aussichtsturm · Wien'},
              {'id': 'Q20829400', 'name': 'TK-Elevator-Testturm Rottweil',    'lat': 48.18000, 'lon': 8.62722,   'height': 246,   'type': 'lookout',    'range': 'Test- & Aussichtsturm · Rottweil'},
              {'id': 'Q697111',   'name': 'Rheinturm Düsseldorf',             'lat': 51.21778, 'lon': 6.76167,   'height': 240.5, 'type': 'tvtower',    'range': 'Fernsehturm · Düsseldorf'},
              {'id': 'Q157729',   'name': 'Fernsehturm Stuttgart',            'lat': 48.75583, 'lon': 9.19028,   'height': 216.6, 'type': 'tvtower',    'range': 'Fernsehturm · Stuttgart'},
              {'id': 'Q158269',   'name': 'Fernsehturm Žižkov Prag',          'lat': 50.08111, 'lon': 14.45111,  'height': 216,   'type': 'tvtower',    'range': 'Fernsehturm · Prag'},
              {'id': 'Q153939',   'name': 'Ulmer Münster',                    'lat': 48.39861, 'lon': 9.99250,   'height': 161.5, 'type': 'church',     'range': 'Höchster Kirchturm · Ulm'},
              {'id': 'Q4176',     'name': 'Kölner Dom',                       'lat': 50.94129, 'lon': 6.95817,   'height': 157.4, 'type': 'church',     'range': 'Kathedrale · Köln'},
              {'id': 'Q569620',   'name': 'City-Hochhaus Leipzig',            'lat': 51.33778, 'lon': 12.37889,  'height': 142.5, 'type': 'skyscraper', 'range': 'Hochhaus · Leipzig'},
              {'id': 'Q5943',     'name': 'Stephansdom Wien',                 'lat': 48.20849, 'lon': 16.37347,  'height': 136.4, 'type': 'church',     'range': 'Kathedrale · Wien'},
              {'id': 'Q174087',   'name': 'Fernsehturm Ještěd (Jeschken)',    'lat': 50.73278, 'lon': 14.98472,  'height': 94,    'type': 'tvtower',    'range': 'Berghotel & Fernsehturm · Liberec'},
              {'id': 'Q125629',   'name': 'Frauenkirche Dresden',             'lat': 51.05188, 'lon': 13.74157,  'height': 91.2,  'type': 'church',     'range': 'Kuppelbau · Dresden'},
              {'id': 'Q1539883',  'name': 'Gottleubatalbrücke Pirna',         'lat': 50.93889, 'lon': 13.94556,  'height': 70,    'type': 'industrial', 'range': 'Talbrücke · Pirna'},
              {'id': 'Q2555153',  'name': 'Weifbergturm Hinterhermsdorf',     'lat': 50.93556, 'lon': 14.37111,  'height': 36.9,  'type': 'lookout',    'range': 'Aussichtsturm · Sächsische Schweiz'},
              {'id': 'Q1001501',  'name': 'Aussichtsturm Großer Winterberg',  'lat': 50.89611, 'lon': 14.25944,  'height': 31.3,  'type': 'lookout',    'range': 'Aussichtsturm · Sächsische Schweiz'}
          ]

          towers_list = list(towers_by_id.values())
          for ct in curated_towers:
              towers_list = [
                  t for t in towers_list
                  if t['id'] != ct['id'] and (abs(t['lat'] - ct['lat']) > 0.008 or abs(t['lon'] - ct['lon']) > 0.010)
              ]
              towers_list.append(ct)

          print(f"Berechne exakte Dominanz für {len(towers_list)} Türme & Bauwerke weltweit ...")
          compute_exact_isolations(towers_list, 'height', 'Q12495')
          towers_list.sort(key=lambda x: x['height'], reverse=True)
          with open('towers.json', 'w', encoding='utf-8') as f:
              json.dump(towers_list, f, ensure_ascii=False, separators=(',', ':'))
          print(f"towers.json geschrieben ({len(towers_list)} Einträge).")

          # ===================================================================
          # 4. LAKES.JSON (Seen, Stauseen & Talsperren + Bade-Erlaubnis!)
          # ===================================================================
          print("Baue globale lakes.json (Seen & Talsperren inkl. Bade-Status) ...")
          lake_batches = [
              ("Natürliche Seen weltweit", "wd:Q23397 wd:Q204324", 0.15),
              ("Talsperren, Stauseen & Baggerseen", "wd:Q131681 wd:Q3253281 wd:Q12284 wd:Q1065704", 0.05)
          ]

          # Bekannte Trinkwassertalsperren & Kraftwerks-Speicherbecken mit striktem Badeverbot
          NO_SWIM_KEYWORDS = (
              'trinkwasser', 'hochbehälter', 'oberbecken', 'unterbecken', 'pumpspeicher',
              'absetzbecken', 'klärteich', 'talsperre gottleuba', 'talsperre lehnmühle',
              'talsperre klingenberg', 'talsperre lichtenberg', 'talsperre eibenstock',
              'talsperre sosa', 'talsperre cranzahl', 'talsperre rauschenbach',
              'talsperre saidenbach', 'talsperre neidberg', 'talsperre dröda',
              'talsperre werda', 'talsperre muldenberg', 'talsperre carlsfeld',
              'rappenbachtalsperre', 'rappbode-talsperre', 'rappbodetalsperre',
              'wahnbachtalsperre', 'große dhünntalsperre', 'dreilägerbachtalsperre',
              'kalltalsperre', 'olaftalsperre', 'breitenbachtalsperre', 'wiehltalsperre',
              'söse-talsperre', 'grane-talsperre', 'eckertalsperre', 'schmalwasser-talsperre',
              'ohra-talsperre', 'leibis-lichte', 'talsperre burgkhammer', 'amselsee'
          )

          lakes_by_id = {}
          for batch_name, classes_str, min_area in lake_batches:
              q = f"""
              SELECT ?item ?coord ?area ?unit ?cls ?use ?label_de ?label_en WHERE {{
                VALUES ?cls {{ {classes_str} }}
