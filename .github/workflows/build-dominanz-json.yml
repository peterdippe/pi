                  except Exception:
                      continue
                  unit_q = (b.get('unit', {}).get('value') or '').split('/').pop()
                  if unit_q == 'Q712226':      # km²
                      pass
                  elif unit_q == 'Q25343':     # m² -> km²
                      a_val /= 1e6
                  elif unit_q == 'Q35852':     # Hektar -> km²
                      a_val *= 0.01
                  elif unit_q == 'Q232291':    # sq mile -> km²
                      a_val *= 2.589988
                  else:
                      continue
