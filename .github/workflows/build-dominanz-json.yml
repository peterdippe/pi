                  if c['id'] != cc['id'] and (abs(c['lat'] - cc['lat']) > 0.008 or abs(c['lon'] - cc['lon']) > 0.010)
              ]
              castles_list.append(cc)

          print(f"Berechne exakte Dominanz für {len(castles_list)} Burgen & Monumente weltweit ...")
          compute_exact_isolations(castles_list, 'age', 'Q211276')
          castles_list.sort(key=lambda x: x['age'], reverse=True)
          with open('castles.json', 'w', encoding='utf-8') as f:
              json.dump(castles_list, f, ensure_ascii=False, separators=(',', ':'))
          print(f"castles.json geschrieben ({len(castles_list)} Einträge).")
          EOF

